name: mednexus-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_project.py
      - run: python run_pipeline.py --clean
      - run: python -c "from mednexus.enhanced_twin_prototype import run_phase12e; print(run_phase12e())"
      - run: python -c "from mednexus.promotion_filter_validation import run_phase12f; print(run_phase12f())"
      - run: pytest -q
